name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build the universal checkin binary
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build
        run: MACOSX_DEPLOYMENT_TARGET=13.0 swift build -c release --arch arm64 --arch x86_64 --product checkin

      - name: Stage the artifact
        run: |
          mkdir -p artifacts
          cp .build/apple/Products/Release/checkin artifacts/checkin
          lipo -info artifacts/checkin
          shasum -a 256 artifacts/checkin | tee artifacts/checkin.sha256

      - name: Derive the version from the tag
        id: version
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF_NAME#refs/tags/}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]]; then
            # A manual run of a branch still builds, stamped with the time.
            version=$(date -u '+%Y.%m.%d.%H%M')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${version//./}" >> "$GITHUB_OUTPUT"

      # The complete Crypt package: the authorisation plugin, checkin, its
      # LaunchDaemon and the scripts that register the login mechanisms. Its
      # build number comes from the tag, so it always sorts above upstream's.
      - name: Build the unsigned Crypt package
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          Package/build-unsigned-pkg.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}" artifacts
          cd artifacts && shasum -a 256 "Crypt-${{ steps.version.outputs.version }}.pkg" > "Crypt-${{ steps.version.outputs.version }}.pkg.sha256"

      - name: Build the unsigned Managed Encryption Escrow package
        working-directory: ManagedEncryptionEscrow
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          GUI_VERSION="${{ steps.version.outputs.version }}"
          make pkg VERSION="$GUI_VERSION"
          cp "build/ManagedEncryptionEscrow-${GUI_VERSION}.pkg" ../artifacts/
          cd ../artifacts && shasum -a 256 "ManagedEncryptionEscrow-${GUI_VERSION}.pkg" > "ManagedEncryptionEscrow-${GUI_VERSION}.pkg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: checkin-universal
          path: artifacts/

      # The binary and both packages published here are unsigned and
      # unnotarised. Whoever deploys them signs every binary inside, innermost
      # first, then the packages; the window's helper refuses every client
      # until the app and helper carry the same Developer ID.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes ""
          gh release upload "${GITHUB_REF_NAME}" artifacts/checkin artifacts/checkin.sha256 artifacts/Crypt-*.pkg artifacts/Crypt-*.pkg.sha256 artifacts/ManagedEncryptionEscrow-*.pkg artifacts/ManagedEncryptionEscrow-*.pkg.sha256 --clobber

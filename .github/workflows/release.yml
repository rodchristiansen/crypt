name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build the universal checkin binary
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build
        run: MACOSX_DEPLOYMENT_TARGET=13.0 swift build -c release --arch arm64 --arch x86_64 --product checkin

      - name: Stage the artifact
        run: |
          mkdir -p artifacts
          cp .build/apple/Products/Release/checkin artifacts/checkin
          lipo -info artifacts/checkin
          shasum -a 256 artifacts/checkin | tee artifacts/checkin.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: checkin-universal
          path: artifacts/

      # The binary published here is unsigned and unnotarised. The installer
      # package is built and signed separately, by an operator holding the
      # Developer ID certificates, with `make dist && make notarize`.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/checkin artifacts/checkin.sha256 --clobber

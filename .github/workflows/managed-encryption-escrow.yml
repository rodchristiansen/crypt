name: Managed Encryption Escrow

on:
  pull_request:
    paths:
      - 'ManagedEncryptionEscrow/**'
      - '.github/workflows/managed-encryption-escrow.yml'
  push:
    branches: [master]
    paths:
      - 'ManagedEncryptionEscrow/**'

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ManagedEncryptionEscrow
    steps:
      - uses: actions/checkout@v4
      - name: Test and build the unsigned app
        run: |
          set -euo pipefail
          # Link against a macOS 26 SDK so the window gets the macOS 26
          # toolbar tabs rather than the older title bar.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          xcrun --show-sdk-version
          swift test
          make app

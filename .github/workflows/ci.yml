name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-macos-26-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-macos-26-

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      - name: Build the universal checkin binary
        run: MACOSX_DEPLOYMENT_TARGET=13.0 swift build -c release --arch arm64 --arch x86_64 --product checkin

      - name: Build the authorization plugin
        run: |
          xcodebuild -project Crypt.xcodeproj -scheme Crypt -configuration Release \
            -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO build
